name: deploy

# The API ships when the agent pushes src/index.js, or when someone runs this by hand.
on:
  push:
    branches: [main]
    paths:
      - 'src/index.js'
      - 'wrangler.toml'
  workflow_dispatch:
    inputs:
      issue:
        description: the issue number this ships
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - name: deploy
        run: npx wrangler deploy --env production
      - name: live check
        run: |
          set -u
          base="${{ vars.API_ORIGIN }}"
          for i in $(seq 1 6); do
            code=$(curl -s -o /tmp/out.json -w '%{http_code}' "$base/incidents")
            if [ "$code" = "200" ]; then
              node -e "const b=require('/tmp/out.json');const ok=Array.isArray(b.incidents)&&b.incidents.every(i=>['id','service','summary','status','openedAt'].every(k=>k in i));process.exit(ok?0:2)" && {
                echo "live: /incidents answers the pinned shape"; exit 0
              }
              echo "live: the Worker is up, the feed is not answering yet (no round open)"; exit 0
            fi
            sleep 10
          done
          echo "live: the Worker itself failed to answer ($code)"; exit 1
